t x="33.000000" y="0.000000" width="403.000000" height="130.000000" rx="18.000000" stroke="#0284C7" fill="#E0F2FE" style="stroke-width:3;" /></g><text x="234.500000" y="38.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="234.500000" dy="0.000000">1. 启动与准备</tspan><tspan x="234.500000" dy="17.000000"> </tspan><tspan x="234.500000" dy="17.000000">Trigger 触发 Loop</tspan><tspan x="234.500000" dy="17.000000">读取 Loop Contract</tspan><tspan x="234.500000" dy="17.000000">收集上下文：日志 / 代码 / 文档 / 历史改动</tspan></text></g><g class="bG9vcA=="><g class="shape" ><rect x="16.000000" y="230.000000" width="436.000000" height="130.000000" rx="18.000000" stroke="#DB2777" fill="#FCE7F3" style="stroke-width:3;" /></g><text x="234.000000" y="268.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="234.000000" dy="0.000000">2. 核心循环</tspan><tspan x="234.000000" dy="17.000000"> </tspan><tspan x="234.000000" dy="17.000000">Analyze：分析问题，形成假设</tspan><tspan x="234.000000" dy="17.000000">Act：执行最小动作，改代码 / 写测试 / 调配置</tspan><tspan x="234.000000" dy="17.000000">Verify：运行测试 / lint / 类型检查 / 业务脚本</tspan></text></g><g class="ZGVjaXNpb24="><g class="shape" ><rect x="0.000000" y="481.000000" width="468.000000" height="130.000000" rx="18.000000" stroke="#7C3AED" fill="#EDE9FE" style="stroke-width:3;" /></g><text x="234.000000" y="519.500000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="234.000000" dy="0.000000">3. 根据验证结果分流</tspan><tspan x="234.000000" dy="17.000000"> </tspan><tspan x="234.000000" dy="17.000000">通过：生成修复摘要 / PR / 风险说明</tspan><tspan x="234.000000" dy="17.000000">失败：读取失败原因，回到 Analyze 继续循环</tspan><tspan x="234.000000" dy="17.000000">触发停止条件：请求人工介入，输出证据和卡点</tspan></text></g><g class="KHN0YXJ0IC0mZ3Q7IGxvb3ApWzBd"><marker id="mk-d2-1700672716-3488378134" markerWidth="10.000000" markerHeight="12.000000" refX="7.000000" refY="6.000000" viewBox="0.000000 0.0000