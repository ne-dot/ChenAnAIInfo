<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Segment 01 - AI Features More, User More Tired</title>
    <style>
      :root {
        --w: 1920px;
        --h: 1080px;
        --blue: #36b8ff;
        --cyan: #5ee7ff;
        --violet: #8f8cff;
        --white: rgba(245, 250, 255, 0.96);
        --muted: rgba(205, 225, 255, 0.68);
        --panel: rgba(8, 24, 48, 0.62);
        --stroke: rgba(117, 200, 255, 0.52);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: var(--w);
        height: var(--h);
        margin: 0;
        overflow: hidden;
        background: #020916;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      }

      #scene {
        position: relative;
        width: var(--w);
        height: var(--h);
        overflow: hidden;
        color: var(--white);
      }

      .camera {
        position: absolute;
        inset: -32px;
        transform-origin: 50% 52%;
      }

      .bg {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(180deg, rgba(0, 6, 16, 0.24), rgba(0, 6, 16, 0.7)),
          radial-gradient(circle at 50% 48%, rgba(37, 146, 255, 0.22), transparent 32%),
          url("../../../assets/backgrounds/ai-research-lab-dark-bg.png");
        background-size: cover;
        background-position: center;
        filter: saturate(0.92) brightness(0.82);
      }

      .vignette {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 50%, transparent 0%, transparent 42%, rgba(0, 6, 18, 0.62) 100%),
          linear-gradient(90deg, rgba(2, 8, 20, 0.55), transparent 22%, transparent 78%, rgba(2, 8, 20, 0.58));
      }

      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.26;
        background-image:
          linear-gradient(rgba(76, 181, 255, 0.14) 1px, transparent 1px),
          linear-gradient(90deg, rgba(76, 181, 255, 0.12) 1px, transparent 1px);
        background-size: 96px 96px;
        mask-image: radial-gradient(circle at 50% 57%, black 0%, transparent 62%);
      }

      .brand {
        position: absolute;
        left: 88px;
        top: 76px;
        color: rgba(196, 231, 255, 0.72);
        font-size: 26px;
        letter-spacing: 0;
        font-weight: 650;
        text-shadow: 0 0 18px rgba(69, 180, 255, 0.34);
      }

      .matrix {
        position: absolute;
        left: 50%;
        top: 48%;
        width: 500px;
        height: 500px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px solid rgba(112, 202, 255, 0.18);
        box-shadow: inset 0 0 70px rgba(41, 165, 255, 0.1), 0 0 100px rgba(30, 126, 255, 0.16);
      }

      .matrix::before,
      .matrix::after {
        content: "";
        position: absolute;
        inset: 64px;
        border-radius: 50%;
        border: 1px solid rgba(94, 211, 255, 0.12);
      }

      .matrix::after {
        inset: 132px;
      }

      .task {
        position: absolute;
        left: 50%;
        top: 48%;
        width: 230px;
        height: 230px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        display: grid;
        place-items: center;
        text-align: center;
        background: radial-gradient(circle at 48% 42%, rgba(49, 170, 255, 0.44), rgba(10, 31, 63, 0.72));
        border: 1px solid rgba(137, 221, 255, 0.52);
        box-shadow: 0 0 42px rgba(54, 184, 255, 0.28), inset 0 0 40px rgba(255, 255, 255, 0.08);
      }

      .task .small {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 28px;
        font-weight: 560;
      }

      .task .big {
        display: block;
        color: var(--white);
        font-size: 44px;
        font-weight: 760;
      }

      .node {
        position: absolute;
        width: 184px;
        height: 78px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: linear-gradient(180deg, rgba(15, 43, 83, 0.66), rgba(7, 20, 42, 0.76));
        border: 1px solid var(--stroke);
        box-shadow: 0 0 24px rgba(54, 184, 255, 0.22), inset 0 0 18px rgba(255, 255, 255, 0.04);
        color: rgba(242, 249, 255, 0.96);
        font-size: 34px;
        font-weight: 680;
        transform-origin: 50% 50%;
      }

      .node svg {
        width: 34px;
        height: 34px;
        stroke: var(--cyan);
        stroke-width: 2.4;
        fill: none;
        filter: drop-shadow(0 0 8px rgba(94, 231, 255, 0.42));
      }

      .node.write {
        left: 458px;
        top: 250px;
      }

      .node.summary {
        left: 1276px;
        top: 248px;
      }

      .node.image {
        left: 320px;
        top: 534px;
      }

      .node.service {
        left: 1418px;
        top: 532px;
      }

      .node.code {
        left: 864px;
        top: 742px;
      }

      svg.paths {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: visible;
      }

      .flow-path {
        fill: none;
        stroke: rgba(120, 214, 255, 0.58);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 10px rgba(54, 184, 255, 0.34));
      }

      .burden-path {
        fill: none;
        stroke: rgba(238, 248, 255, 0.78);
        stroke-width: 3.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 16px rgba(142, 198, 255, 0.42));
      }

      .burden-label {
        position: absolute;
        min-width: 156px;
        padding: 16px 20px;
        border-radius: 22px;
        background: rgba(4, 13, 30, 0.72);
        border: 1px solid rgba(214, 236, 255, 0.34);
        color: rgba(245, 250, 255, 0.92);
        font-size: 32px;
        font-weight: 680;
        text-align: center;
        box-shadow: 0 0 24px rgba(121, 188, 255, 0.18);
      }

      .burden-label.find {
        left: 690px;
        top: 282px;
      }

      .burden-label.tool {
        left: 1046px;
        top: 282px;
      }

      .burden-label.steps {
        left: 1044px;
        top: 596px;
      }

      .burden-label.check {
        left: 684px;
        top: 596px;
      }

      .headline {
        position: absolute;
        left: 0;
        right: 0;
        top: 78px;
        text-align: center;
        font-weight: 800;
        color: rgba(248, 252, 255, 0.98);
        font-size: 58px;
        line-height: 1.15;
        text-shadow: 0 0 28px rgba(64, 184, 255, 0.32);
      }

      .headline .accent {
        color: var(--cyan);
      }

      .question {
        position: absolute;
        left: 50%;
        top: 47%;
        width: 760px;
        transform: translate(-50%, -50%);
        padding: 34px 52px 38px;
        text-align: center;
        border-radius: 32px;
        background: rgba(3, 12, 28, 0.82);
        border: 1px solid rgba(125, 211, 255, 0.42);
        box-shadow: 0 0 80px rgba(41, 160, 255, 0.24), inset 0 0 30px rgba(255, 255, 255, 0.04);
      }

      .question .kicker {
        color: rgba(180, 219, 255, 0.76);
        font-size: 34px;
        font-weight: 620;
        margin-bottom: 18px;
      }

      .question .main {
        color: white;
        font-size: 68px;
        font-weight: 850;
      }

      .caption {
        position: absolute;
        left: 110px;
        bottom: 74px;
        padding: 18px 24px;
        border-radius: 22px;
        background: rgba(5, 15, 34, 0.64);
        border: 1px solid rgba(118, 206, 255, 0.25);
        color: rgba(218, 237, 255, 0.72);
        font-size: 28px;
        font-weight: 580;
      }

      [data-el] {
        opacity: 0;
        transform: translate3d(0, 0, 0);
      }
    </style>
  </head>
  <body>
    <main id="scene">
      <div class="camera" data-el="camera">
        <div class="bg"></div>
        <div class="grid" data-el="grid"></div>
        <div class="vignette"></div>
      </div>

      <div class="brand" data-el="brand">AI RESEARCH LAB</div>

      <svg class="paths" viewBox="0 0 1920 1080" aria-hidden="true">
        <path data-el="path-write" class="flow-path" pathLength="1" d="M642 289 H760 Q824 289 824 353 V425 Q824 489 888 489 H845" />
        <path data-el="path-summary" class="flow-path" pathLength="1" d="M1276 287 H1160 Q1096 287 1096 351 V425 Q1096 489 1032 489 H1075" />
        <path data-el="path-image" class="flow-path" pathLength="1" d="M504 573 H642 Q706 573 706 523 V489 Q706 449 770 449 H845" />
        <path data-el="path-service" class="flow-path" pathLength="1" d="M1418 571 H1278 Q1214 571 1214 522 V489 Q1214 449 1150 449 H1075" />
        <path data-el="path-code" class="flow-path" pathLength="1" d="M956 742 V670 Q956 606 956 606 V603" />

        <path data-el="burden-ring" class="burden-path" pathLength="1" d="M788 322 H1132 Q1196 322 1196 386 V594 Q1196 658 1132 658 H788 Q724 658 724 594 V386 Q724 322 788 322" />
      </svg>

      <div class="matrix" data-el="matrix"></div>

      <div class="task" data-el="task">
        <span>
          <span class="small">用户任务</span>
          <span class="big">完成工作</span>
        </span>
      </div>

      <div class="node write" data-el="node-write">
        <svg viewBox="0 0 48 48"><path d="M10 38h28" /><path d="M14 31l3-10L32 6l10 10-15 15-10 3z" /></svg>
        写作
      </div>
      <div class="node summary" data-el="node-summary">
        <svg viewBox="0 0 48 48"><path d="M14 10h20l6 6v22H14z" /><path d="M20 23h16M20 30h12" /></svg>
        摘要
      </div>
      <div class="node image" data-el="node-image">
        <svg viewBox="0 0 48 48"><rect x="10" y="12" width="28" height="24" rx="4" /><path d="M15 32l8-8 6 6 4-4 8 8" /><circle cx="31" cy="20" r="3" /></svg>
        修图
      </div>
      <div class="node service" data-el="node-service">
        <svg viewBox="0 0 48 48"><path d="M14 26v-4a10 10 0 0 1 20 0v4" /><path d="M12 25h6v10h-6zM30 25h6v10h-6z" /><path d="M30 35c-2 4-8 5-12 2" /></svg>
        客服
      </div>
      <div class="node code" data-el="node-code">
        <svg viewBox="0 0 48 48"><path d="M18 16L9 24l9 8M30 16l9 8-9 8M26 12l-4 24" /></svg>
        代码
      </div>

      <div class="burden-label find" data-el="label-find">找入口</div>
      <div class="burden-label tool" data-el="label-tool">选工具</div>
      <div class="burden-label steps" data-el="label-steps">排步骤</div>
      <div class="burden-label check" data-el="label-check">检查结果</div>

      <div class="headline" data-el="headline">
        <span class="accent">AI 功能</span>越来越多<br />为什么你还是累？
      </div>

      <section class="question" data-el="question">
        <div class="kicker">真正的问题是</div>
        <div class="main">工作还在谁身上？</div>
      </section>

      <div class="caption" data-el="caption">很多 AI 功能，只是把某一步变快了</div>
    </main>

    <script>
      const els = {};
      document.querySelectorAll("[data-el]").forEach((el) => {
        els[el.dataset.el] = el;
      });

      const clamp = (v, min = 0, max = 1) => Math.max(min, Math.min(max, v));
      const ease = (v) => {
        const x = clamp(v);
        return 1 - Math.pow(1 - x, 3);
      };
      const mix = (a, b, t) => a + (b - a) * t;

      function set(el, styles) {
        Object.assign(el.style, styles);
      }

      function enter(el, t, delay, dur, tx = 0, ty = 18, scaleFrom = 0.96) {
        const p = ease((t - delay) / dur);
        set(el, {
          opacity: p,
          transform: `translate(${mix(tx, 0, p)}px, ${mix(ty, 0, p)}px) scale(${mix(scaleFrom, 1, p)})`,
        });
      }

      function pathDraw(el, t, delay, dur) {
        const p = ease((t - delay) / dur);
        set(el, {
          opacity: p,
          strokeDasharray: "1",
          strokeDashoffset: String(1 - p),
        });
      }

      function renderFrame(t) {
        const push = ease(t / 16);
        set(els.camera, {
          opacity: 1,
          transform: `scale(${mix(1, 1.045, push)}) translateY(${mix(0, -10, push)}px)`,
        });
        set(els.grid, { opacity: 0.18 + 0.08 * Math.sin(t * 0.7) });
        enter(els.brand, t, 0.1, 0.8, 0, -10, 1);

        enter(els.matrix, t, 0.2, 1.1, 0, 0, 0.9);
        set(els.matrix, {
          opacity: clamp((t - 0.2) / 1.2) * clamp((14.2 - t) / 1.2),
          transform: `translate(-50%, -50%) rotate(${t * 3.5}deg) scale(${1 + 0.015 * Math.sin(t * 1.7)})`,
        });

        enter(els.task, t, 0.55, 1.0, 0, 10, 0.92);
        set(els.task, {
          opacity: clamp((t - 0.55) / 1) * clamp((14 - t) / 1.0),
          transform: `translate(-50%, -50%) scale(${1 + 0.016 * Math.sin(t * 2.2)})`,
        });

        const nodeData = [
          ["node-write", 1.2, -22, -18],
          ["node-summary", 1.65, 22, -18],
          ["node-image", 2.1, -24, 20],
          ["node-service", 2.55, 24, 20],
          ["node-code", 3.0, 0, 24],
        ];
        nodeData.forEach(([key, delay, tx, ty], idx) => {
          enter(els[key], t, delay, 0.75, tx, ty, 0.9);
          const alive = clamp((t - delay) / 0.75) * clamp((10.5 - t) / 1.7);
          const breathe = 1 + 0.012 * Math.sin(t * 2 + idx);
          set(els[key], {
            opacity: alive,
            transform: `scale(${breathe})`,
          });
        });

        pathDraw(els["path-write"], t, 1.65, 0.9);
        pathDraw(els["path-summary"], t, 2.1, 0.9);
        pathDraw(els["path-image"], t, 2.55, 0.9);
        pathDraw(els["path-service"], t, 3.0, 0.9);
        pathDraw(els["path-code"], t, 3.45, 0.9);

        enter(els.headline, t, 3.7, 0.9, 0, -16, 0.98);
        set(els.headline, {
          opacity: clamp((t - 3.7) / 0.9) * clamp((9.1 - t) / 1.0),
          transform: "translateY(0)",
        });

        pathDraw(els["burden-ring"], t, 8.2, 1.25);
        const burdenLabels = [
          ["label-find", 8.7],
          ["label-tool", 9.0],
          ["label-steps", 9.3],
          ["label-check", 9.6],
        ];
        burdenLabels.forEach(([key, delay], idx) => {
          enter(els[key], t, delay, 0.6, 0, 10, 0.94);
          const op = clamp((t - delay) / 0.6) * clamp((13.4 - t) / 0.8);
          set(els[key], {
            opacity: op,
            transform: `translateY(${2 * Math.sin(t * 2 + idx)}px)`,
          });
        });

        enter(els.caption, t, 10.6, 0.8, -14, 0, 1);
        set(els.caption, {
          opacity: clamp((t - 10.6) / 0.8) * clamp((13.8 - t) / 0.7),
        });

        enter(els.question, t, 13.0, 0.85, 0, 18, 0.94);
        set(els.question, {
          opacity: clamp((t - 13.0) / 0.85),
          transform: `translate(-50%, -50%) scale(${mix(0.94, 1, ease((t - 13.0) / 0.85))})`,
        });

        const darken = clamp((t - 12.6) / 1.0) * 0.46;
        document.documentElement.style.setProperty("--darken", darken);
      }

      window.renderFrame = renderFrame;
      renderFrame(0);
    </script>
  </body>
</html>
