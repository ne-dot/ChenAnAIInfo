<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07091c;
      }

      #segment-05-preview {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #07091c;
      }

      .clip { position: absolute; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-s5-preview-root" id="segment-05-preview" data-composition-id="segment-05-entry-redesigned-preview" data-start="0" data-duration="37" data-width="1920" data-height="1080">
      <div
        data-hf-id="hf-s5-preview-slot"
        id="entry-redesigned-preview-slot"
        class="clip"
        data-composition-id="entry-redesigned"
        data-composition-src="compositions/entry-redesigned.html"
        data-start="0"
        data-duration="37"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["segment-05-entry-redesigned-preview"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
