      </div>

      <script>
        window.__timelines = window.__timelines || {};

        const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
        const goalText = "修复这个 Bug";
        const goalProxy = { chars: 0 };
        const flashContent = document.querySelector("#flash-content");
        const flashTitle = document.querySelector("#flash-title");
        const flashScenes = {
          understand: {
            title: "目标解析",
            html: '<div class="intent-pill hot">意图：修复缺陷</div><div class="intent-pill">约束：不破坏现有筛选</div><div class="intent-pill">验收：刷新后仍保持</div>'
          },
          context: {
            title: "读取上下文",
            html: '<div class="context-row hot"></div><div class="context-row"></div><div class="context-row hot"></div><div class="context-row"></div>'
          },
          tools: {
            title: "工具调用",
            html: '<div class="tool-pill hot">编辑器</div><div class="tool-pill">终端</div><div class="tool-pill hot">浏览器</div><div class="tool-pill">Diff</div>'
          },
          execute: {
            title: "推进执行",
            html: '<div class="todo-row done"><span>定位状态丢失</span><span>DONE</span></div><div class="todo-row done"><span>补上路由同步</span><span>DONE</span></div><div class="todo-row done"><span>刷新验证</span><span>PASS</span></div>'
          }
        };

        function setFlash(scene) {
          flashTitle.textContent = flashScenes[scene].title;
          flashContent.innerHTML = flashScenes[scene].html;
        }

        setFlash("understand");

        const drawPaths = document.querySelectorAll("#s4-paths .system-line, #s4-paths .flow-line");
        drawPaths.forEach((path) => {
          const len = path.getTotalLength();
          path.style.strokeDasharray = `${len}`;
          path.style.strokeDashoffset = `${len}`;
        });

        gsap.set(["#s4-title", "#prompt-card", "#s4-ai-core", ".ability-node", "#flashback", "#s4-caption", "#result-badge", "#s4-final-card"], {
          transformOrigin: "50% 50%",
        });
        gsap.set(["#s4-title", "#prompt-card", "#s4-ai-core", ".ability-node", "#flashback", "#s4-caption", "#result-badge", "#s4-final-card"], { opacity: 0 });
        gsap.set("#result-badge", { scale: 0.9 });
        gsap.set("#s4-final-card", { scale: 0.94 });

        tl.to("#s4-root", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
        tl.to("#s4-grid", { x: -36, y: -22, duration: 53, ease: "none" }, 0);
        tl.fromTo("#s4-title", { opacity: 0, x: -34 }, { opacity: 1, x: 0, duration: 0.58 }, 0.18);
        tl.fromTo("#prompt-card", { opacity: 0, y: 28, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.72 }, 0.7);
        tl.to(goalProxy, {
          chars: goalText.length,
          duration: 1.1,
          ease: "none",
          onUpdate: () => {
            document.querySelector("#s4-typed-goal").textContent = goalText.slice(0, Math.round(goalProxy.chars));
          },
        }, 1.18);
        tl.to("#s4-prompt-cursor", { opacity: 0.16, duration: 0.16, yoyo: true, repeat: 8, ease: "none" }, 1.18);

        tl.to(["#line-prompt", "#line-prompt-glow"], { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" }, 2.9);
        tl.fromTo("#s4-ai-core", { opacity: 0, y: 34, scale: 0.72, rotationX: -8 }, { opacity: 1, y: 0, scale: 1, rotationX: 0, duration: 0.82, ease: "back.out(1.24)" }, 3.18);
        tl.to("#s4-ai-core", { scale: 1.025, duration: 0.72, yoyo: true, repeat: 10, ease: "sine.inOut" }, 4.05);

        const abilities = [
          { node: "#ability-understand", paths: ["#line-a", "#line-a-glow"], at: 4.5, x: -34, y: 0 },
          { node: "#ability-context", paths: ["#line-b", "#line-b-glow"], at: 5.12, x: -34, y: 0 },
          { node: "#ability-tools", paths: ["#line-c", "#line-c-glow"], at: 5.74, x: -34, y: 0 },
          { node: "#ability-execute", paths: ["#line-d", "#line-d-glow"], at: 6.36, x: -34, y: 0 },
        ];
        abilities.forEach((item) => {
          tl.to(item.paths, { strokeDashoffset: 0, duration: 0.48, ease: "power2.out" }, item.at);
          tl.fromTo(item.node, { opacity: 0, x: item.x, y: item.y, scale: 0.82 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.58, ease: "back.out(1.35)" }, item.at + 0.12);
        });
        tl.fromTo("#flashback", { opacity: 0, y: 18, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.6 }, 7.1);
        tl.fromTo("#s4-caption", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.52 }, 7.2);

        function highlight(selector, scene, caption, at) {
          tl.call(() => setFlash(scene), null, at);
          tl.to(".ability-node", { opacity: 0.42, scale: 0.96, duration: 0.34, ease: "power2.out" }, at);
          tl.to(selector, { opacity: 1, scale: 1.08, duration: 0.34, ease: "power2.out" }, at);
          tl.call(() => document.querySelector(selector).classList.add("active"), null, at + 0.01);
          tl.call(() => document.querySelector("#s4-caption").textContent = caption, null, at + 0.02);
          tl.fromTo("#flashback", { y: 14 }, { y: 0, duration: 0.42, ease: "power2.out" }, at + 0.08);
          tl.to(selector, { scale: 1.02, duration: 0.7, yoyo: true, repeat: 3, ease: "sine.inOut" }, at + 0.45);
          tl.call(() => document.querySelector(selector).classList.remove("active"), null, at + 8.8);
        }

        highlight("#ability-understand", "understand", "理解目标：系统先读懂你真正要的结果", 8.0);
        highlight("#ability-context", "context", "读取上下文：项目结构、代码状态和报错一起进入判断", 18.0);
        highlight("#ability-tools", "tools", "调用工具：它不只给建议，还能动手改、运行、观察", 28.0);
        highlight("#ability-execute", "execute", "推进执行：失败后继续查、继续改、继续验证", 38.0);

        tl.to(["#flow-main", "#flow-glow"], { strokeDashoffset: 0, duration: 2.2, ease: "power2.inOut" }, 40.2);
        tl.to(".ability-node", { opacity: 1, scale: 1, duration: 0.42, ease: "power2.out" }, 45.0);
        tl.to("#flashback", { opacity: 0, y: 12, duration: 0.34, ease: "power2.inOut" }, 44.9);
        tl.fromTo("#result-badge", { opacity: 0, y: 20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.58, ease: "back.out(1.35)" }, 45.15);
        tl.to("#result-badge", { scale: 1.04, duration: 0.44, yoyo: true, repeat: 2, ease: "sine.inOut" }, 45.8);
        tl.call(() => document.querySelector("#s4-caption").textContent = "越好的产品，越是前台简单，后台复杂", null, 45.2);

        tl.to(["#system-stage", "#s4-title", "#s4-caption"], { opacity: 0, scale: 0.97, duration: 0.68, ease: "power3.inOut" }, 48.25);
        tl.fromTo("#s4-final-card", { opacity: 0, y: 28, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.78 }, 49.0);
        tl.fromTo("#s4-final-card .big", { opacity: 0, y: 18, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, y: 0, clipPath: "inset(0 0% 0 0)", duration: 0.78 }, 49.42);
        tl.to("#s4-final-card", { scale: 1.015, duration: 0.55, yoyo: true, repeat: 1, ease: "sine.inOut" }, 50.42);

        window.__timelines["capabilities-move-background"] = tl;
      </script>
    </template>
  </body>
</html>
